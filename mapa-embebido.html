<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Centinela, mapa galáctico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --void:#010204;
  --panel:rgba(5,6,10,.9);
  --line:rgba(230,226,214,.12);
  --line2:rgba(230,226,214,.30);
  --bone:#e6e2d6;
  --dim:#8c8b84;
  --faint:#5f5e59;
  --brecha:#d9534a;
  --hdr:52px;--sb:248px;--cw:384px;
  --ui:'EB Garamond','Avenir Next','Segoe UI',ui-sans-serif,system-ui,sans-serif;
  --body:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--void);color:var(--bone);font-family:var(--ui);overflow:hidden;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;background:var(--void)}
#gl.drag{cursor:grabbing}
#gl.over{cursor:pointer}
button{font-family:var(--ui)}
button:focus-visible,input:focus-visible+.sw{outline:1px solid var(--bone);outline-offset:3px}

/* cabecera: migas de pan a la izquierda, opciones a la derecha */
.top{position:fixed;left:0;right:0;top:0;height:var(--hdr);z-index:5;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 20px;background:rgba(3,4,7,.86);border-bottom:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.crumb{display:flex;align-items:baseline;gap:10px;min-width:0;white-space:nowrap}
.brandname{font:400 13px var(--ui);letter-spacing:.26em;color:var(--bone);margin-right:6px}
.sep{color:var(--faint);font:300 14px var(--ui)}
.back{background:none;border:0;padding:0;font:400 14px var(--ui);letter-spacing:.03em;color:var(--bone);cursor:default}
body.insys .back{color:var(--dim);cursor:pointer;border-bottom:1px solid transparent}
body.insys .back:hover{color:var(--bone);border-bottom-color:var(--line2)}
.here{font:400 14px var(--ui);letter-spacing:.03em;color:var(--bone)}
.meta{font:400 12.5px var(--ui);color:var(--dim);letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis;margin-left:6px}
.insys-only{display:none}
body.insys .insys-only{display:inline}

.bar{display:flex;align-items:center;min-width:0}
.bar .set{display:flex;align-items:center}
.bar .set.hid{display:none}
.bar button{position:relative;font:400 13px var(--ui);letter-spacing:.03em;color:var(--dim);background:none;border:0;padding:8px 13px;cursor:pointer;white-space:nowrap}
.bar button:hover{color:var(--bone)}
.bar button[aria-pressed=true]{color:var(--bone)}
.bar button[aria-pressed=true]::after{content:"";position:absolute;left:13px;right:13px;bottom:3px;height:1px;background:var(--bone)}
.bar button.narr{margin-left:10px;border-left:1px solid var(--line);padding-left:20px}
.bar button.narr::after{left:20px}
.bar button.narr[aria-pressed=true]{color:#f0c9c4}
.bar button.narr[aria-pressed=true]::after{background:var(--brecha)}
.tbtn{display:none}

/* panel izquierdo: índice */
.panel{position:fixed;z-index:3;left:0;top:var(--hdr);bottom:0;width:var(--sb);background:var(--panel);border-right:1px solid var(--line);overflow:auto;scrollbar-width:thin;scrollbar-color:#2a2a2a transparent}
.panel .grp{font:400 11px var(--ui);color:var(--faint);letter-spacing:.18em;text-transform:uppercase;padding:22px 20px 8px;margin:0}
.panel .grp:first-child{padding-top:18px}
.panel ul{list-style:none;margin:0;padding:0}
.panel li{display:flex;align-items:center;border-top:1px solid transparent}
.panel li button.nm{flex:1;text-align:left;background:none;border:0;color:#cfcbbf;font:300 15px/1.25 var(--ui);padding:8px 20px 8px 4px;cursor:pointer;letter-spacing:.01em}
.panel li button.nm:hover{background:rgba(255,255,255,.04);color:#fff}
.panel li.off button.nm{color:var(--faint)}
.panel li.sel{box-shadow:inset 2px 0 0 var(--bone);background:rgba(255,255,255,.05)}
.panel li.sel button.nm{color:#fff}
.vis{position:relative;display:inline-flex;width:34px;height:30px;align-items:center;justify-content:center;flex:none;cursor:pointer;margin-left:6px}
.vis input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.vis .sw{width:9px;height:9px;border:1px solid var(--dim);background:var(--bone)}
.vis input:not(:checked)+.sw{background:transparent;border-color:var(--faint)}
.dot{display:inline-flex;width:34px;height:30px;align-items:center;justify-content:center;flex:none;margin-left:6px}
.dot i{width:5px;height:5px;border-radius:50%;border:1px solid var(--dim)}
.dot i.red{border-color:var(--brecha);background:var(--brecha)}
.pslot{display:inline-flex;width:34px;height:30px;align-items:center;justify-content:center;flex:none;margin-left:6px}
.pico{display:block;border:1px solid var(--dim);border-radius:50%;width:12px;height:12px}
.pico.star{background:var(--bone);border-color:var(--bone);width:9px;height:9px}
li.sel .pico:not(.star){border-color:var(--bone)}
.panel .tail{height:16px}

/* ficha: panel derecho */
.card{position:fixed;z-index:4;right:0;top:var(--hdr);bottom:0;width:var(--cw);max-width:100vw;overflow:auto;background:var(--panel);border-left:1px solid var(--line);padding:30px 32px 26px;visibility:hidden;transform:translateX(100%);transition:transform .45s cubic-bezier(.2,.8,.2,1),visibility 0s .45s;scrollbar-width:thin;scrollbar-color:#2a2a2a transparent}
.card.open{visibility:visible;transform:none;transition-delay:0s}
.card .kind{font:400 11px var(--ui);color:var(--dim);letter-spacing:.18em;text-transform:uppercase;margin:0 36px 10px 0}
.card h3{font:400 32px/1.15 var(--body);letter-spacing:.005em;margin:0 0 20px;padding-bottom:20px;border-bottom:1px solid var(--line)}
.card p{font:400 17px/1.65 var(--body);margin:0 0 14px;color:#d6d2c7;max-width:62ch}
.card p.pending{font-style:italic;color:var(--dim)}
.card dl.fields{display:grid;grid-template-columns:auto 1fr;margin:6px 0 20px;font:400 13.5px/1.4 var(--ui);border-top:1px solid var(--line)}
.card dl.fields dt,.card dl.fields dd{padding:9px 0;border-bottom:1px solid var(--line);margin:0}
.card dl.fields dt{color:var(--dim);padding-right:22px}
.card dl.fields dd{color:var(--bone);font-variant-numeric:tabular-nums}
.card .sec{display:none;border-left:1px solid var(--brecha);padding:2px 0 2px 16px;margin:22px 0 6px}
body.narr .card .sec{display:block}
.card .sec h4{font:400 11px var(--ui);letter-spacing:.18em;text-transform:uppercase;color:var(--brecha);margin:0 0 10px}
.card .sec p{color:#ecd5d0}
.card .foot{font:italic 400 14px/1.45 var(--body);color:var(--dim);margin:20px 0 0}
.card .act{margin:24px 0 4px}
.card .act button{font:400 13px var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--bone);background:transparent;border:1px solid var(--line2);padding:14px 18px;cursor:pointer;width:100%}
.card .act button:hover{background:rgba(255,255,255,.07);border-color:var(--bone)}
.card .x{position:absolute;top:12px;right:14px;width:34px;height:34px;border:0;background:transparent;color:var(--dim);font:300 24px/1 var(--ui);cursor:pointer}
.card .x:hover{color:var(--bone)}

/* etiquetas sobre el mapa */
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1;transition:opacity .5s ease}
.lb{position:absolute;left:0;top:0;white-space:nowrap;will-change:transform;text-shadow:0 0 6px #000,0 0 2px #000;display:none}
.lb.reg{font:italic 400 15px var(--body);letter-spacing:.05em;color:rgba(230,226,214,.78)}
.lb.sys{font:400 13px var(--ui);letter-spacing:.05em;color:var(--bone)}
.lb.sys.nar{color:#e0a29b}
.lb.pl{font:400 12.5px var(--ui);letter-spacing:.04em;color:#c4c0b4}
.lb.pl.on{color:#fff}
.lb.stl{font:400 12.5px var(--ui);letter-spacing:.06em;color:#f1e3c8}
.mk{position:absolute;left:0;top:0;width:14px;height:14px;margin:-7px 0 0 -7px;border:1px solid rgba(230,226,214,.5);border-radius:50%;display:none;will-change:transform;pointer-events:none}
.mk.nar{border-color:rgba(217,83,74,.75)}
.ret{position:fixed;left:0;top:0;width:34px;height:34px;margin:-17px 0 0 -17px;pointer-events:none;opacity:0;z-index:2;will-change:transform}
.ret::before,.ret::after{content:"";position:absolute;inset:0;border:1px solid rgba(255,255,255,.8);border-radius:50%}
.ret::after{inset:11px;border-color:rgba(255,255,255,.45)}
.rtip{position:fixed;left:0;top:0;pointer-events:none;opacity:0;z-index:2;font:400 13px var(--ui);letter-spacing:.04em;color:var(--bone);text-shadow:0 0 6px #000;white-space:nowrap;will-change:transform}
.rtip small{display:block;color:var(--dim);font-size:11.5px;margin-top:2px;letter-spacing:.06em}
.ring{position:fixed;left:0;top:0;width:40px;height:40px;margin:-20px 0 0 -20px;border:1px solid var(--bone);border-radius:50%;pointer-events:none;opacity:0;z-index:2;will-change:transform}

.hint{position:fixed;z-index:2;left:calc(var(--sb) + 28px);bottom:20px;font:400 12.5px/1.5 var(--ui);letter-spacing:.03em;color:var(--dim);pointer-events:none;max-width:460px;transition:opacity .8s}
.hint.gone{opacity:0}
.fail{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:30px;text-align:center;font:400 17px/1.6 var(--body);z-index:9}

@media (max-width:820px){
  :root{--sb:240px;--cw:340px}
}
@media (max-width:720px){
  :root{--hdr:48px}
  .top{padding:0 14px}
  .brandname{letter-spacing:.2em;font-size:12px}
  .meta{display:none}
  .tbtn{display:block;background:none;border:0;color:var(--bone);font:400 13px var(--ui);letter-spacing:.04em;padding:8px 0 8px 12px;cursor:pointer}
  .bar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:rgba(3,4,7,.92);border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:none;padding-bottom:env(safe-area-inset-bottom,0px)}
  .bar .set{width:max-content;margin:0 auto}
  .bar button{padding:13px 11px;font-size:12.5px}
  .bar button[aria-pressed=true]::after{left:11px;right:11px;bottom:6px}
  .bar button.narr{margin-left:4px;padding-left:14px}.bar button.narr::after{left:14px}
  .panel{transform:translateX(-102%);transition:transform .3s;z-index:6;width:min(300px,86vw);bottom:0}
  .panel.open{transform:none}
  .card{top:auto;left:0;right:0;width:auto;bottom:calc(46px + env(safe-area-inset-bottom,0px));max-height:52%;border-left:0;border-top:1px solid var(--line);padding:22px 20px 18px;transform:translateY(100%)}
  .card h3{font-size:26px;margin-bottom:14px;padding-bottom:14px}
  .hint{left:14px;right:14px;bottom:60px;font-size:12px}
}
@media (prefers-reduced-motion:reduce){
  .card,.panel,.hint,#labels{transition:none}
}
</style>
<style>.top,.panel,.hint,.card{display:none!important}:root{--hdr:0px;--sb:0px}.lb.reg{font-size:17px;letter-spacing:.12em;color:rgba(222,200,150,.8)}.lb.sys{font-size:14.5px;letter-spacing:.08em;color:#efe3c6}body.narr .lb.reg{color:rgba(240,150,130,.85)}body.narr .lb.sys{color:#f6d3c8}body.narr .mk{border-color:rgba(229,85,63,.7)}.ring{border-color:#d4b26a}body.narr .ring{border-color:#e5553f}</style><style>
.lb.reg{font:500 13.5px 'Cormorant Garamond',serif!important;text-transform:uppercase;letter-spacing:.42em!important;color:rgba(236,229,214,.8)!important;font-style:normal!important;text-shadow:0 1px 3px rgba(0,0,0,.9)!important}
.lb.sys{font:500 12px 'EB Garamond',serif!important;text-transform:uppercase;letter-spacing:.2em!important;color:#ece5d6!important;text-shadow:0 1px 3px rgba(0,0,0,.95),0 0 10px rgba(0,0,0,.6)!important;-webkit-font-smoothing:antialiased}
.lb.sys small{display:block;text-transform:none;letter-spacing:.01em;font:italic 400 13.5px 'EB Garamond',serif;color:#c9c1b1;margin-top:3px}
.lb{text-shadow:0 0 2px #000,0 0 6px #000,0 0 14px rgba(0,0,0,.85)!important}
#labels.nosub .lb.sys small{display:none}
.mk{width:22px!important;height:22px!important;margin:-11px 0 0 -11px!important;border:1px solid rgba(232,215,180,.8)!important;background:rgba(5,6,10,.55)}
.mk::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;background:#f3e6c8;transform:rotate(45deg)}
.mk.nar::after{background:#e8634b}.mk.nar{border-color:rgba(232,99,75,.8)!important}
body.narr .lb.reg{color:rgba(240,160,140,.85)!important}body.narr .lb.sys{color:#f6d8cc!important}
</style></head>
<body>
<canvas id="gl" aria-label="Mapa 3D de la galaxia de Centinela"></canvas>
<div id="labels" aria-hidden="true"></div>
<div class="ring" id="ring"></div>
<div class="ret" id="ret"></div>
<div class="rtip" id="rtip"></div>

<header class="top">
  <nav class="crumb" aria-label="Ubicación">
    <span class="brandname">CENTINELA</span>
    <span class="sep">/</span>
    <button class="back" id="back">Galaxia</button>
    <span class="sep insys-only">/</span>
    <span class="here insys-only" id="sysname"></span>
    <span class="meta insys-only" id="sysmeta"></span>
  </nav>
  <div class="bar" role="toolbar" aria-label="Opciones">
    <div class="set" id="barGal">
      <button id="bPol" aria-pressed="false" title="Muestra fronteras y nombres de los territorios">Mapa político</button>
      <button id="bMap" aria-pressed="false" title="Superpone tu mapa 2D para comparar fronteras">Mapa original</button>
      <button id="bRot" aria-pressed="true">Rotación</button>
      <button id="bHome">Vista inicial</button>
      <button id="bNarr" class="narr" aria-pressed="false" title="Muestra lo que la galaxia no sabe">Narrador</button>
    </div>
    <div class="set hid" id="barSys">
      <button id="bOrb" aria-pressed="true">Órbitas</button>
      <button id="bLab" aria-pressed="true">Nombres</button>
      <button id="bPause" aria-pressed="false">Pausa</button>
      <button id="bAll">Ver sistema</button>
      <button id="bNarr2" class="narr" aria-pressed="false">Narrador</button>
    </div>
  </div>
  <button class="tbtn" id="tbtn" aria-expanded="false" aria-controls="panel">Índice</button>
</header>

<nav class="panel" id="panel" aria-label="Índice"><div id="plist"></div><div class="tail"></div></nav>

<aside class="card" id="card" aria-live="polite">
  <button class="x" id="cx" aria-label="Cerrar ficha">&times;</button>
  <p class="kind" id="ckind"></p>
  <h3 id="ctitle"></h3>
  <div id="cbody"></div>
  <div class="act" id="cact"><button id="cabtn">Abrir sistema</button></div>
  <p class="foot" id="cfoot"></p>
</aside>

<div class="hint" id="hint">Arrastra para girar &middot; rueda para acercar &middot; pasa sobre una estrella para abrirla</div>
<div class="fail" id="fail">Tu navegador no ha podido iniciar WebGL, que este mapa necesita. Prueba con otro navegador o activa la aceleración por hardware.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rnd=mulberry(20261001);
const gauss=()=>{let u=0,v=0;while(!u)u=rnd();while(!v)v=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(TAU*v);};
function inPoly(x,y,p){let c=false;for(let i=0,j=p.length-1;i<p.length;j=i++){const a=p[i],b=p[j];if((a[1]>y)!==(b[1]>y)&&x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0])c=!c;}return c;}
function area(p){let s=0;for(let i=0,j=p.length-1;i<p.length;j=i++)s+=p[j][0]*p[i][1]-p[i][0]*p[j][1];return Math.abs(s)/2;}
function hash(i,j){let h=Math.imul(i,374761393)+Math.imul(j,668265263);h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967295;}
function vnoise(x,y){const i=Math.floor(x),j=Math.floor(y),fx=x-i,fy=y-j,u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy);return lerp(lerp(hash(i,j),hash(i+1,j),u),lerp(hash(i,j+1),hash(i+1,j+1),u),v);}
const fbm2=(x,y)=>.6*vnoise(x,y)+.3*vnoise(x*2.1+7,y*2.1+3)+.1*vnoise(x*4.3,y*4.3);

class OrbitCam{
  constructor(o){
    this.target=new THREE.Vector3();this.wt=new THREE.Vector3();
    this.radius=this.wr=o.radius;this.phi=o.phi;this.theta=o.theta||0;
    this.wphi=null;this.wtheta=null;this.minR=o.minR;this.maxR=o.maxR;this.vT=0;this.vP=0;
  }
  fly(t,r,ph,th){this.wt.copy(t);this.wr=clamp(r,this.minR,this.maxR);this.wphi=ph===undefined?null:ph;this.wtheta=th===undefined?null:th;}
  zoom(f){this.wr=clamp(this.wr*f,this.minR,this.maxR);}
  free(){this.wphi=this.wtheta=null;this.vT=this.vP=0;}
  step(dt){
    const k=reduce?1:1-Math.exp(-dt/260);
    this.target.lerp(this.wt,k);
    this.radius=Math.exp(lerp(Math.log(this.radius),Math.log(this.wr),k));
    if(this.wphi!==null)this.phi=lerp(this.phi,this.wphi,k);
    if(this.wtheta!==null){let d=(this.wtheta-this.theta)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;this.theta+=d*k;}
    if(Math.abs(this.vT)>1e-5||Math.abs(this.vP)>1e-5){this.theta+=this.vT;this.phi+=this.vP;this.vT*=.92;this.vP*=.92;}
    this.phi=clamp(this.phi,.05,2.4);
    this.radius=clamp(this.radius,this.minR*.7,this.maxR*1.05);
  }
  place(c){
    const sp=Math.sin(this.phi);
    c.position.set(this.target.x+this.radius*sp*Math.sin(this.theta),this.target.y+this.radius*Math.cos(this.phi),this.target.z+this.radius*sp*Math.cos(this.theta));
    c.lookAt(this.target);c.updateMatrixWorld();
  }
}

const NOISE=`
float sm(float a,float b,float x){return a<b?smoothstep(a,b,x):1.0-smoothstep(b,a,x);}
float hash31(vec3 p){p=fract(p*0.3183099+vec3(.1,.2,.3));p*=17.0;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}
float vnoise(vec3 x){vec3 i=floor(x),f=fract(x);f=f*f*(3.0-2.0*f);
 return mix(mix(mix(hash31(i),hash31(i+vec3(1,0,0)),f.x),mix(hash31(i+vec3(0,1,0)),hash31(i+vec3(1,1,0)),f.x),f.y),
            mix(mix(hash31(i+vec3(0,0,1)),hash31(i+vec3(1,0,1)),f.x),mix(hash31(i+vec3(0,1,1)),hash31(i+vec3(1,1,1)),f.x),f.y),f.z);}
float fbm(vec3 p){float a=.5,s=0.;for(int i=0;i<5;i++){s+=a*vnoise(p);p=p*2.03+vec3(1.7,9.2,3.1);a*=.5;}return s;}
float worley(vec3 p){vec3 i=floor(p),f=fract(p);float d=1.5;
 for(int x=-1;x<=1;x++)for(int y=-1;y<=1;y++)for(int z=-1;z<=1;z++){vec3 g=vec3(float(x),float(y),float(z));
  vec3 o=vec3(hash31(i+g),hash31(i+g+7.3),hash31(i+g+13.1));d=min(d,length(g+o-f));}return d;}
`;

const A_END=.42,C0=.34,F0=.30,F1=.46,SYS_FAR=2.6;
/* s=0 galaxia, s=1 sistema. Un único movimiento hacia delante, sin pasar de largo:
   A: la cámara se acerca a la estrella en la galaxia hasta verla como un punto con halo.
   F: relevo entre escenas mientras la estrella es solo un punto, así no hay corte visible.
   C: el sistema se amplía desde ese punto: la estrella crece y brotan órbitas y planetas. */
function applyS(s){
  const g=GAL.cam,a=clamp(s/A_END,0,1),c=clamp((s-C0)/(1-C0),0,1),ea=sstep(a);
  g.target.lerpVectors(T.tG0,curStar,sstep(clamp(a*1.6,0,1)));
  g.radius=Math.exp(lerp(Math.log(T.rG0),Math.log(1.6),ea));g.phi=lerp(T.phG0,SYS_PHI,ea);g.theta=T.th;
  g.wt.copy(g.target);g.wr=g.radius;g.place(camera);

  starGlow.visible=a>.05;starGlow.position.copy(curStar);starGlow.material.uniforms.uOp.value=sstep(clamp((a-.08)/.8,0,1));
  const ec=1-Math.pow(1-c,2.2);

  tcam.radius=Math.exp(lerp(Math.log(T.Rsys*SYS_FAR),Math.log(T.Rsys),ec));tcam.phi=lerp(SYS_PHI,T.phS0,sstep(c));tcam.theta=T.th;tcam.place(camera2);

  renderer.setRenderTarget(rt);renderer.render(sysScene,camera2);renderer.setRenderTarget(null);
  compMat.uniforms.uA.value=alpha;renderer.autoClear=false;renderer.render(compScene,compCam);renderer.autoClear=true;
}
$('back').addEventListener('click',()=>closeSystem());

/* =====================================================================
   ENTRADA: puntero, rueda, selección y hover

const ring=$('ring'),ret=$('ret'),rtip=$('rtip');
const v3=new THREE.Vector3();
function screenOf(pos){v3.copy(pos).project(camera);if(v3.z>1||v3.z<-1)return null;return{x:(v3.x*.5+.5)*innerWidth,y:(-v3.y*.5+.5)*innerHeight};}
function nearestStar(x,y,tol){
  let best=null,bd=tol;
  SYS.forEach(s=>{if(s.special||s.narr&&!narr)return;const p=screenOf(s.pos);if(!p)return;const d=Math.hypot(p.x-x,p.y-y)-3;if(d<bd){bd=d;best={t:'s',s};}});
  for(let i=0;i<CAND.length;i++){const c=CAND[i];const p=screenOf(c.pos);if(!p)continue;const d=Math.hypot(p.x-x,p.y-y);if(d<bd){bd=d;best={t:'c',c};}}
  const bs=SYS.find(s=>s.special);if(bs){const p=screenOf(bs.pos);if(p){const d=Math.hypot(p.x-x,p.y-y)-14;if(d<bd){bd=d;best={t:'s',s:bs};}}}
  return best;
}
function nearestPlanet(x,y,tol){
  let best=-1,bd=tol;
  SY.planets.forEach((P,i)=>{const p=screenOf(P.pos);if(!p)return;
    const edge=v3.copy(P.pos).project(camera);
    const rpx=Math.max(0,(P.vis*P.scaleNow)/Math.max(.001,P.dist)*innerHeight/(2*Math.tan(THREE.MathUtils.degToRad(22.5))));
    const d=Math.hypot(p.x-x,p.y-y)-Math.min(rpx,80);if(d<bd){bd=d;best=i;}});
  return best;
}
function viewCam(){return mode==='gal'?GAL.cam:sysCam;}
function hideHint(){$('hint').classList.add('gone');}
setTimeout(hideHint,14000);

const ptrs=new Map();let down=null,pinchD=0;
function pan(dx,dy){
  if(mode!=='gal')return;const c=GAL.cam;
  const k=c.radius*.0017,right=new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld,0);
  const fwd=new THREE.Vector3(-Math.sin(c.theta),0,-Math.cos(c.theta));
  c.target.addScaledVector(right,-dx*k).addScaledVector(fwd,dy*k);if(c.target.length()>140)c.target.setLength(140);c.wt.copy(c.target);
}
cv.addEventListener('pointerdown',e=>{
  if(mode==='trans')return;
  cv.setPointerCapture&&cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1)down={x:e.clientX,y:e.clientY,t:performance.now(),moved:false,btn:e.button};
  else if(down){down.moved=true;const [a,b]=[...ptrs.values()];pinchD=Math.hypot(a.x-b.x,a.y-b.y);}
  const c=viewCam();c.vT=c.vP=0;lastInput=performance.now();hideHint();cv.classList.add('drag');
});
cv.addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId);
  if(!p){if(e.pointerType==='mouse')hover(e.clientX,e.clientY);return;}
  const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
  if(down&&Math.hypot(e.clientX-down.x,e.clientY-down.y)>6)down.moved=true;
  lastInput=performance.now();const c=viewCam();
  if(ptrs.size===1){
    if(e.shiftKey||(down&&down.btn===2)||(e.buttons&2))pan(dx,dy);
    else{c.free();c.vT=-dx*.005;c.vP=-dy*.005;c.theta+=c.vT;c.phi+=c.vP;}
  }else if(ptrs.size===2){
    const [a,b]=[...ptrs.values()],d=Math.hypot(a.x-b.x,a.y-b.y);
    if(pinchD>0&&d>0)c.zoom(pinchD/d);pinchD=d;pan(dx/2,dy/2);
  }
});
function release(e){
  const had=ptrs.delete(e.pointerId);
  if(!ptrs.size)cv.classList.remove('drag');
  if(had&&down&&!ptrs.size&&e.type==='pointerup'&&!down.moved&&performance.now()-down.t<600&&down.btn===0)pick(e.clientX,e.clientY,e.pointerType);
  if(!ptrs.size)down=null;
}
cv.addEventListener('pointerup',release);cv.addEventListener('pointercancel',release);
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('wheel',e=>{e.preventDefault();if(mode==='trans')return;lastInput=performance.now();hideHint();viewCam().zoom(Math.exp(e.deltaY*(e.deltaMode===1?16:1)*.0011));},{passive:false});

const raycaster=new THREE.Raycaster(),plane=new THREE.Plane(new THREE.Vector3(0,1,0),0),hitv=new THREE.Vector3();
function regionFromScreen(x,y){
  raycaster.setFromCamera(new THREE.Vector2(x/innerWidth*2-1,-(y/innerHeight)*2+1),camera);
  if(raycaster.ray.intersectPlane(plane,hitv))return regionAt(hitv.x/S+C,hitv.z/S+C,true);
  return null;
}
function hover(x,y){
  if(mode==='trans')return;
  if(mode==='gal'){
    const n=nearestStar(x,y,16);cv.classList.toggle('over',!!n);
    if(n){
      const pos=n.t==='s'?n.s.pos:n.c.pos,p=screenOf(pos);
      if(p){ret.style.opacity=1;ret.style.transform='translate('+p.x.toFixed(1)+'px,'+p.y.toFixed(1)+'px)';
        const r=n.t==='s'?null:(polit?(n.c.reg?REGBY[n.c.reg].name:'Espacio sin reclamar'):'Sistema sin catalogar');
        rtip.textContent=n.t==='s'?n.s.name:candName(n.c);
        const sm=el('small','',n.t==='s'?'Lugar con nombre':r);rtip.appendChild(sm);
        rtip.style.opacity=1;rtip.style.transform='translate('+(p.x+24).toFixed(1)+'px,'+(p.y-12).toFixed(1)+'px)';}
    }else{ret.style.opacity=0;rtip.style.opacity=0;}
    const hr=(n||!polit)?null:regionFromScreen(x,y);if(hr!==hoverReg){hoverReg=hr;paintReg();}
  }else{
    const i=nearestPlanet(x,y,18);cv.classList.toggle('over',i>=0);
  }
}
function pick(x,y,type){
  if(mode==='trans')return;
  if(mode==='gal'){
    const n=nearestStar(x,y,type==='touch'?30:16);
    if(n){if(n.t==='s')selNamed(n.s.id,true);else selCand(n.c,true);return;}
    const r=polit?regionFromScreen(x,y):null;if(r){selReg(r.id,true);return;}
    clearSel();
  }else{
    const i=nearestPlanet(x,y,type==='touch'?34:20);
    if(i>=0)selPlanet(i,true);else if(psel>=0)unfocusPlanet();
  }
}
$('cx').addEventListener('click',()=>{if(mode==='sys'&&psel>=0)unfocusPlanet();else clearSel();});
addEventListener('keydown',e=>{if(mode==='trans')return;if(e.key==='Escape'){if(mode==='sys'){if(psel>=0)unfocusPlanet();else closeSystem();}else clearSel();}});

/* =====================================================================
   BOTONES
   ===================================================================== */
function setNarr(v){
  narr=v;document.body.classList.toggle('narr',narr);
  ['bNarr','bNarr2'].forEach(id=>$(id).setAttribute('aria-pressed',String(narr)));
  SYS.filter(s=>s.narr).forEach(s=>{s.on=narr;});refreshNamPts();
  if(mode==='gal'){if(!narr&&sel&&sel.t==='s'&&SYS.find(s=>s.id===sel.id).narr)clearSel();buildPanelGal();}
}
$('bNarr').addEventListener('click',()=>setNarr(!narr));
$('bNarr2').addEventListener('click',()=>setNarr(!narr));
function setPolit(v){
  polit=v;$('bPol').setAttribute('aria-pressed',String(v));
  polPlane.visible=true;polFade=v?1:0;
  hoverReg=null;if(!v&&sel&&sel.t==='r')clearSel();
  if(mode==='gal')buildPanelGal();paintReg();
}
$('bPol').addEventListener('click',()=>setPolit(!polit));
$('bMap').addEventListener('click',()=>{const on=$('bMap').getAttribute('aria-pressed')!=='true';$('bMap').setAttribute('aria-pressed',String(on));mapPlane.visible=on;});
$('bRot').setAttribute('aria-pressed',String(auto));
$('bRot').addEventListener('click',()=>{auto=!auto;$('bRot').setAttribute('aria-pressed',String(auto));});
$('bHome').addEventListener('click',()=>{clearSel();hideHint();GAL.cam.fly(new THREE.Vector3(),HOME.r,HOME.phi,HOME.th);lastInput=performance.now();});
$('bOrb').addEventListener('click',()=>{showOrb=!showOrb;$('bOrb').setAttribute('aria-pressed',String(showOrb));});
$('bLab').addEventListener('click',()=>{showLab=!showLab;$('bLab').setAttribute('aria-pressed',String(showLab));});
$('bPause').addEventListener('click',()=>{paused=!paused;$('bPause').setAttribute('aria-pressed',String(paused));});
$('bAll').addEventListener('click',()=>{if(SY){psel=-1;sysFocus=-1;closeCard();sysCam.fly(new THREE.Vector3(),SY.aMax*2.4,1.0);}});

/* =====================================================================
   BUCLE
   ===================================================================== */
function resize(){
  const w=innerWidth,h=innerHeight,pr=renderer.getPixelRatio();
  renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();camera2.aspect=w/h;camera2.updateProjectionMatrix();if(typeof rt!=='undefined')rt.setSize(Math.max(1,Math.floor(w*pr)),Math.max(1,Math.floor(h*pr)));
  starMat.uniforms.uScale.value=h*pr*.45;starMat.uniforms.uPx.value=pr;catMat.uniforms.uPx.value=pr;bgStarMat.uniforms.uPx.value=pr;
}
addEventListener('resize',resize);resize();

function labelsGal(){
  {const sub=GAL.cam.radius<95;if(labelsEl.dataset.sub!==String(sub)){labelsEl.dataset.sub=String(sub);labelsEl.classList.toggle('nosub',!sub);}}
  const ra=clamp((GAL.cam.radius-55)/70,0,1);
  REGS.forEach(r=>{const e=r.el,show=(polit||MAJOR[r.id])&&r.vis&&r.lp,ra2=polit?ra:Math.max(ra,.35),p=show&&ra2>.02?screenOf(r.lp):null;if(!p){e.style.display='none';return;}
    e.style.display='block';e.style.opacity=((polit?.85:.6)*ra2).toFixed(2);e.style.transform='translate('+p.x.toFixed(1)+'px,'+p.y.toFixed(1)+'px) translate(-50%,-50%)';});
  SYS.forEach(s=>{
    const on=s.on&&(!s.minor||GAL.cam.radius<58),p=on?screenOf(s.pos):null;
    if(!p){s.el.style.display='none';if(s.mk)s.mk.style.display='none';return;}
    s.el.style.display='block';s.el.style.transform=s.special?'translate('+p.x.toFixed(1)+'px,'+(p.y+Math.min(150,2400/Math.max(GAL.cam.radius,16))).toFixed(1)+'px) translate(-50%,0)':'translate('+(p.x+20).toFixed(1)+'px,'+(p.y-10).toFixed(1)+'px)';
    if(s.mk){s.mk.style.display='block';s.mk.style.transform='translate('+p.x.toFixed(1)+'px,'+p.y.toFixed(1)+'px)';}
  });
  if(sel&&(sel.t==='s'||sel.t==='c')){const pos=sel.t==='s'?SYS.find(s=>s.id===sel.id).pos:sel.cand.pos,p=screenOf(pos);
    if(p){ring.style.opacity=1;ring.style.transform='translate('+p.x.toFixed(1)+'px,'+p.y.toFixed(1)+'px)';}else ring.style.opacity=0;}
}
function labelsSys(){
  REGS.forEach(r=>r.el.style.display='none');SYS.forEach(s=>{s.el.style.display='none';if(s.mk)s.mk.style.display='none';});
  if(!SY)return;
  const sp=screenOf(new THREE.Vector3(0,0,0));
  if(sp&&showLab&&sysCam.radius>SY.sd.r*3){SY.starLabel.style.display='block';SY.starLabel.style.transform='translate('+sp.x.toFixed(1)+'px,'+(sp.y+SY.sd.r*400/Math.max(1,sysCam.radius)+18).toFixed(1)+'px) translate(-50%,0)';}else SY.starLabel.style.display='none';
  SY.planets.forEach((P,i)=>{
    const p=showLab?screenOf(P.pos):null,e=P.el;
    if(!p||(psel>=0&&psel!==i&&P.dist>SY.aMax*1.2)){e.style.display='none';return;}
    const rpx=(P.vis*P.scaleNow)/Math.max(.001,P.dist)*innerHeight/(2*Math.tan(THREE.MathUtils.degToRad(22.5)));
    e.style.display='block';e.classList.toggle('on',psel===i);
    e.style.transform='translate('+p.x.toFixed(1)+'px,'+(p.y+Math.min(rpx,innerHeight*.5)+12).toFixed(1)+'px) translate(-50%,0)';
  });
}
let insetT=0,insetC=0;
function applyInset(){[camera,camera2].forEach(c=>{if(Math.abs(insetC)>.5)c.setViewOffset(innerWidth,innerHeight,-insetC/2,0,innerWidth,innerHeight);else if(c.view&&c.view.enabled)c.clearViewOffset();});}
let prev=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(50,now-prev);prev=now;if(Math.abs(insetT-insetC)>.3||Math.abs(insetC)>.5){insetC+=(insetT-insetC)*(reduce?1:.1);applyInset();}
  if(mode==='gal'){
    const c=GAL.cam;
    if(!ptrs.size&&auto&&!sel&&now-lastInput>2500&&c.wtheta===null)c.theta+=dt*.00005;
    c.step(dt);c.place(camera);
    riftU.uT.value=now*.001;{const u=polMat.uniforms.uOp;u.value+=(polFade-u.value)*.12;if(polFade===0&&u.value<.01){u.value=0;polPlane.visible=false;}}hazeMat.uniforms.uFar.value=Math.min(1,Math.max(0,(GAL.cam.radius-50)/80));{const ph=((now*.001)%3.4)/3.4,b=Math.exp(-Math.pow((ph-.06)/.035,2))+.65*Math.exp(-Math.pow((ph-.19)/.04,2));riftU.uB.value=reduce?0:b;}if(window.__brechaTear){const tr=window.__brechaTear;tr.updateMatrixWorld();const cl=tr.worldToLocal(camera.position.clone());{const nz=Math.abs(cl.z)/Math.max(cl.length(),1e-6);riftU.uE.value=1/Math.max(Math.sqrt(nz),.5);}riftU.uC.value=1-Math.min(1,Math.max(0,(camera.position.distanceTo(brecha.position)-25)/60));const k=riftU.uN.value,b=riftU.uB.value;window.__brechaTear.scale.set((1+.45*k)*(1+.06*b),(1+.3*k)*(1+.03*b),1);}if(window.__brechaVoid){const vm=window.__brechaVoid;vm.updateMatrixWorld();vm.material.uniforms.uCamO.value.copy(camera.position);vm.worldToLocal(vm.material.uniforms.uCamO.value);}riftU.uN.value+=((narr?1:0)-riftU.uN.value)*.04;
    galBack.forEach(o=>o.position.copy(camera.position).add(o.userData.off));
    labelsGal();renderer.render(galScene,camera);
  }else if(mode==='trans'){
    const u=clamp((now-T.t0)/T.dur,0,1),e=.6*u+.4*sstep(u),p=T.dir>0?e:1-e;
    const al=applyS(p);updatePlanets(dt,camera2);
    galBack.forEach(o=>o.position.copy(camera.position).add(o.userData.off));
    sysBack.forEach(o=>o.position.copy(camera2.position).add(o.userData.off));
    renderTrans(al);
    if(u>=1){const th=T.th,R=T.Rsys,d=T.dir;T=null;if(d>0)finishIn(th,R);else finishOut(th);}
  }else{
    updatePlanets(dt,camera);
    if(sysFocus>=0){const P=SY.planets[sysFocus];sysCam.wt.copy(P.pos);}
    sysCam.step(dt);sysCam.place(camera);
    sysBack.forEach(o=>o.position.copy(camera.position).add(o.userData.off));
    labelsSys();renderer.render(sysScene,camera);
  }
}
REGS.forEach(r=>{r.lines.forEach(l=>l.visible=false);r.fills.forEach(f=>f.visible=false);});
buildPanelGal();
requestAnimationFrame(frame);

function peek(t,id){
  if(mode!=='gal')return;
  if(!t){ret.style.opacity=0;rtip.style.opacity=0;if(hoverReg){hoverReg=null;paintReg();}return;}
  if(t==='s'){const s=SYS.find(x=>x.id===id);if(!s)return;const p=screenOf(s.pos);if(!p)return;
    ret.style.opacity=1;ret.style.transform='translate('+p.x.toFixed(1)+'px,'+p.y.toFixed(1)+'px)';
    rtip.textContent=s.name;rtip.appendChild(el('small','','Citado en el códice'));
    rtip.style.opacity=1;rtip.style.transform='translate('+(p.x+24).toFixed(1)+'px,'+(p.y-12).toFixed(1)+'px)';}
  else{const r=REGBY[id];if(r&&r!==hoverReg){hoverReg=r;paintReg();}}
}
/* ganchos de depuración, inocuos */
window.__cm={peek,setInset:v=>{insetT=v;},zoom:f=>viewCam().zoom(f),act:()=>{if(cabtn.onclick)cabtn.onclick();},btn:id=>{$(id).click();return $(id).getAttribute('aria-pressed');},clearSel,setPolit,getT:()=>T,galScene,brecha,openSystem,closeSystem,selPlanet,selNamed,selReg,setNarr,fromData,CAND,GAL,sysCam,get SY(){return SY;},get mode(){return mode;},unfocusPlanet,camera,renderer,THREE};
})();
